@media (prefers-color-scheme: dark){

}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.5 Archivo,system-ui,sans-serif}
header{background:var(--dial);color:#e8edf3;padding:40px 16px 28px}
.wrap{max-width:880px;margin:0 auto}
h1{font-stretch:125%;font-weight:800;font-size:clamp(34px,7vw,56px);line-height:1;margin:0 0 10px;letter-spacing:-.01em}
header p{margin:0;color:#aab6c4;max-width:60ch}
.summary{display:flex;gap:28px;flex-wrap:wrap;margin-top:22px}
.summary b{font-stretch:125%;font-size:28px;display:block;line-height:1.1}
.summary span{color:#aab6c4;font-size:13px}
.summary .hit b{color:#5fd39a}
main{padding:24px 16px 64px}
.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filters button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:999px;cursor:pointer}
.filters button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.filters button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--lume);outline-offset:2px}
.watch{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
.watch.hit{border-color:var(--lume);box-shadow:inset 4px 0 0 var(--lume)}
summary{list-style:none;cursor:pointer;padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center}
summary::-webkit-details-marker{display:none}
.name{font-weight:650;font-size:16px}
.price{font-stretch:115%;font-weight:750;font-size:22px;text-align:right;white-space:nowrap}
.meta{color:var(--muted);font-size:13px}
.delta{text-align:right;font-size:13px;color:var(--muted);white-space:nowrap}
.hit .delta{color:var(--lume);font-weight:650}
.track{grid-column:1/-1;position:relative;height:22px;margin-top:6px}
.track .rail{position:absolute;left:0;right:0;top:10px;height:2px;background:var(--line)}
.track .fill{position:absolute;top:9px;height:4px;border-radius:2px;background:var(--steel)}
.hit .track .fill{background:var(--lume)}
.track .tgt{position:absolute;top:2px;width:2px;height:18px;background:var(--ink)}
.track .now{position:absolute;top:5px;width:12px;height:12px;border-radius:50%;background:var(--card);border:3px solid var(--ink);transform:translateX(-6px)}
.hit .track .now{border-color:var(--lume)}
.body{padding:0 18px 16px;display:grid;grid-template-columns:1fr 240px;gap:20px}
.offers{margin:0;padding:0;list-style:none}
.offers li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.offers a{color:var(--ink)}
.offers .best{font-weight:700}
.spark{width:100%;height:80px}
.spark path{fill:none;stroke:var(--ink);stroke-width:1.6}
.spark line{stroke:var(--lume);stroke-dasharray:4 3}
.sparkcap{font-size:12px;color:var(--muted)}
.empty{color:var(--muted);padding:24px 0}
footer{color:var(--muted);font-size:13px;margin-top:28px}
@media (max-width:640px){.body{grid-template-columns:1fr}.price{font-size:19px}}
@media (prefers-reduced-motion:no-preference){.now{transition:left .4s ease}}
</style>

  const today = h.filter(r=>r.date===lastDate).sort((a,b)=>a.price-b.price);
  const byDay = {};
  h.forEach(r=>{byDay[r.date]=Math.min(byDay[r.date]??Infinity,r.price)});
  const series = Object.entries(byDay).sort();
  const best = today[0];
  const gap = best && w.target_eur ? (best.price - w.target_eur)/w.target_eur : null;
  return {w,today,series,best,gap,hit:gap!==null&&gap<=0};
}).sort((a,b)=>(a.gap??9)-(b.gap??9));

function spark(series,target){
  if(series.length<2) return `<p class="sparkcap">Graf sa ukáže po druhom dni merania.</p>`;
  const v=series.map(s=>s[1]).concat(target?[target]:[]), lo=Math.min(...v), hi=Math.max(...v), W=240,H=80,p=6;
  const x=i=>p+i*(W-2*p)/(series.length-1), y=n=>H-p-(n-lo)/((hi-lo)||1)*(H-2*p);
  const d=series.map((s,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(s[1]).toFixed(1)).join(' ');
  const t=target?`<line x1="0" x2="${W}" y1="${y(target)}" y2="${y(target)}"/>`:'';
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Vývoj najnižšej ceny">${t}<path d="${d}"/></svg>
  <p class="sparkcap">Najnižšia cena za ${series.length} dní, prerušovaná čiara je cieľ.</p>`;
}

function track(r){
  if(!r.best||!r.w.target_eur) return '';
  // spoločná stupnica pre všetky hodinky: cieľ −25 % až +50 %, aby sa vzdialenosti dali porovnať
  const lo=r.w.target_eur*0.75, hi=r.w.target_eur*1.5;
  const pos=n=>(Math.max(0,Math.min(1,(n-lo)/(hi-lo)))*100).toFixed(1)+'%';
  const a=Math.min(r.best.price,r.w.target_eur), b=Math.max(r.best.price,r.w.target_eur);
  return `<div class="track" aria-hidden="true"><div class="rail"></div>
    <div class="fill" style="left:${pos(a)};width:calc(${pos(b)} - ${pos(a)})"></div>
    <div class="tgt" style="left:${pos(r.w.target_eur)}"></div><div class="now" style="left:${pos(r.best.price)}"></div></div>`;
}

function render(f){
  const list=document.getElementById('list');
  const shown=rows.filter(r=>f==='all'||(f==='hit'&&r.hit)||(f==='close'&&r.gap!==null&&r.gap<=0.10));
  list.innerHTML = shown.length ? shown.map(r=>{
    const delta = r.gap===null ? (r.w.target_eur?'cena dnes nenačítaná':'len sledovanie')
      : r.hit ? `${eur(r.w.target_eur-r.best.price)} pod cieľom` : `o ${Math.round(r.gap*100)} % nad cieľom ${eur(r.w.target_eur)}`;
    const offers = r.today.map((o,i)=>`<li class="${i?'':'best'}"><a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.shop)}</a><span>${eur(o.price)}</span></li>`).join('')
      || '<li>Dnes žiadna dostupná ponuka (vypredané alebo stránka neodpovedala).</li>';
    return `<details class="watch${r.hit?' hit':''}"><summary>
      <span class="name">${esc(r.w.name)}</span><span class="price">${r.best?eur(r.best.price):'—'}</span>
      <span class="meta">${r.best?'najlacnejšie: '+esc(r.best.shop):''}</span><span class="delta">${delta}</span>
      ${track(r)}</summary>
      <div class="body"><ul class="offers">${offers}</ul><div>${spark(r.series,r.w.target_eur)}</div></div></details>`;
  }).join('') : '<p class="empty">Momentálne nič. Keď cena klesne, objaví sa tu a príde ti notifikácia.</p>';
}

const hits=rows.filter(r=>r.hit).length, close=rows.filter(r=>r.gap!==null&&r.gap>0&&r.gap<=0.10).length;
document.getElementById('summary').innerHTML=
  `<div class="hit"><b>${hits}</b><span>pod cieľom</span></div><div><b>${close}</b><span>do 10 % od cieľa</span></div><div><b>${rows.length}</b><span>sledovaných</span></div>`;
document.getElementById('foot').textContent = lastDate
  ? `Ceny z ${lastDate}, stránka vygenerovaná ${DATA.generated}. Aktualizuje sa každý deň o 9:00.`
  : 'Zatiaľ žiadne merania. Spusti python3 ~/hodinky/price_watch.py.';
document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.filters button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  render(b.dataset.f);
});
render('all');
</script>
</body>
</html>
