<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hodinky</title>
<meta name="theme-color" content="#f3f3f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hodinky">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon.png">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  color-scheme: light;
  --paper:#f3f3f0; --plate:#e6e6e1; --ink:#0d0d0d; --body:#262626; --muted:#6f6f68; --rule:#cfcfc8;
  --sold:#ff5b14;
  --stencil:"Michroma", "Eurostile", sans-serif;
  --sans:"Schibsted Grotesk", system-ui, sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-synthesis:none;margin:0;background:var(--paper);color:var(--body);font:400 15px/1.5 var(--sans)}
a{color:inherit}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--sold);outline-offset:3px}
.page{max-width:1280px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 80px}

/* obálka */
.cover{padding:max(20px,env(safe-area-inset-top)) 0 36px;border-bottom:3px solid var(--ink)}
.masthead{display:flex;justify-content:space-between;gap:16px;font-size:13px;color:var(--muted)}
.masthead strong{color:var(--ink);font-weight:700}
.cover h1{font-family:var(--stencil);font-weight:400;font-size:clamp(40px,8.6vw,124px);line-height:1.02;letter-spacing:-.04em;max-width:11ch;color:var(--ink);margin:40px 0 24px;text-transform:none}

/* ovládanie */
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--ink);display:flex;gap:6px;align-items:center;padding:12px 0;overflow-x:auto;scrollbar-width:none}
.bar button{font:500 14px/1 var(--sans);background:none;border:1px solid var(--ink);padding:8px 12px;color:var(--ink);cursor:pointer;white-space:nowrap;border-radius:0}
.bar button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.bar .count{margin-left:auto;font-family:var(--stencil);font-weight:400;font-size:15px;color:var(--ink);white-space:nowrap;padding-left:12px}

/* loty */
.lots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:72px 32px;padding-top:56px}
.lot{display:flex;flex-direction:column;min-width:0;position:relative}
.lotno{position:absolute;z-index:2;top:-26px;left:-4px;font-family:var(--stencil);font-weight:400;font-size:54px;letter-spacing:-.06em;line-height:1;color:var(--ink);pointer-events:none}
.stamp{position:absolute;z-index:2;top:16px;right:-8px;transform:rotate(4deg);background:var(--sold);color:#fff;font:700 13px/1 var(--sans);padding:8px 10px}
/* podložka s minútovou stupnicou po obvode */
.plate{aspect-ratio:4/5;background:var(--plate);display:grid;place-items:center;overflow:hidden;margin-bottom:16px;position:relative}
.plate::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:
    repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 12px) top/100% 7px no-repeat,
    repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 12px) bottom/100% 7px no-repeat,
    repeating-linear-gradient(0deg,var(--ink) 0 1px,transparent 1px 12px) left/7px 100% no-repeat,
    repeating-linear-gradient(0deg,var(--ink) 0 1px,transparent 1px 12px) right/7px 100% no-repeat;
  opacity:.55}
.plate img{width:80%;height:80%;object-fit:contain;mix-blend-mode:multiply}
.plate.bleed img{width:100%;height:100%;object-fit:cover;mix-blend-mode:normal}
.brand{font-size:13px;font-weight:700;color:var(--muted);margin:0}
.model{font-family:var(--stencil);font-weight:400;font-size:21px;line-height:1.15;letter-spacing:-.02em;color:var(--ink);margin:2px 0 6px}
.ref{font-size:13px;color:var(--muted);margin:0 0 10px}
.note{font-size:15px;line-height:1.45;margin:0 0 18px;color:var(--body)}
.est{margin:auto 0 0;border-top:3px solid var(--ink);padding-top:10px;display:grid;grid-template-columns:auto 1fr;gap:2px 16px;font-size:14px}
.est dt{color:var(--muted)}
.est dd{margin:0;text-align:right;color:var(--ink)}
.est .now{font-family:var(--stencil);font-weight:400;font-size:28px;line-height:1.1;letter-spacing:-.04em}
.cur{font-family:var(--sans);font-weight:500;letter-spacing:0}
.now .cur{font-size:.62em}
.est .now small{display:block;font:400 12px/1.4 var(--sans);color:var(--muted)}
.under .est .now{color:var(--sold)}
.gap{grid-column:1/-1;font-size:13px;color:var(--muted);text-align:right}
.under .gap{color:var(--sold);font-weight:700}
details{margin-top:12px;border-top:1px solid var(--rule)}
summary{cursor:pointer;list-style:none;padding:10px 0;font-size:13px;font-weight:500;color:var(--ink);display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--stencil);font-size:18px;line-height:.8}
details[open] summary::after{content:"−"}
.offers{list-style:none;margin:0;padding:0}
.offers li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px dotted var(--rule);font-size:14px}
.offers a{text-underline-offset:3px;text-decoration-thickness:1px}
.spark{display:block;width:100%;height:56px;margin-top:12px}
.spark path{fill:none;stroke:var(--ink);stroke-width:1.5;vector-effect:non-scaling-stroke}
.spark line{stroke:var(--sold);stroke-width:1;stroke-dasharray:3 3;vector-effect:non-scaling-stroke}
.cap{font-size:12px;color:var(--muted);margin:6px 0 0}
.empty{font-family:var(--stencil);font-size:24px;line-height:1.2;color:var(--ink);padding:48px 0;grid-column:1/-1}
footer{margin-top:80px;padding-top:16px;border-top:3px solid var(--ink);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;font-size:13px;color:var(--muted)}
footer p{margin:0}

@media (max-width:980px){.lots{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){
  .cover h1{font-size:13.4vw}
  footer{grid-template-columns:1fr}
  .lots{grid-template-columns:1fr;gap:72px}
  .lotno{font-size:48px;top:-22px}
  .stamp{right:0}
}
</style>
</head>
<body>
<div class="page">
  <header class="cover">
    <div class="masthead"><strong>Katalóg hodiniek</strong><span id="dated"></span></div>
    <h1>Until I have Rolex money.</h1>
  </header>

  <nav class="bar" aria-label="Zobrazenie">
    <button data-v="lot" aria-pressed="true">Poradie pridania</button>
    <button data-v="close" aria-pressed="false">Najbližšie k odhadu</button>
    <button data-v="under" aria-pressed="false">Pod odhadom</button>
    <span class="count" id="count"></span>
  </nav>

  <main class="lots" id="lots"></main>

  <footer>
    <p id="updated"></p>
    <p>Pri lotoch z UK, USA a Japonska je cena odhad vrátane 23 % DPH, cla a poplatku kuriéra.</p>
    <p>Keď ponuka klesne pod odhad, príde notifikácia do mobilu cez ntfy.</p>
  </footer>
</div>

const eur = n => n.toLocaleString('sk-SK',{minimumFractionDigits:n<100&&n%1?2:0,maximumFractionDigits:n<100?2:0})+'\u00a0<span class="cur">€</span>';
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const words = ['nula','jeden','dva','tri','štyri','päť','šesť','sedem','osem','deväť','desať'];
const say = n => n<=10 ? words[n] : String(n);
const lotKey = l => parseInt(l)*10 + (/[A-Z]$/.test(l) ? 1 : 0);

const last = DATA.history.reduce((m,r)=>r.date>m?r.date:m,'');
const lots = DATA.watches.map(w=>{
  const h = DATA.history.filter(r=>r.watch===w.name);
  const today = h.filter(r=>r.date===last).sort((a,b)=>a.price-b.price);
  const byDay = {}; h.forEach(r=>{byDay[r.date]=Math.min(byDay[r.date]??Infinity,r.price)});
  const best = today[0];
  const gap = best && w.target_eur ? (best.price-w.target_eur)/w.target_eur : null;
  return {w,today,best,gap,series:Object.entries(byDay).sort(),under:gap!==null&&gap<=0,
          landed:/landed/.test(w.name)?', odhad s clom a DPH':/bez dopravy/.test(w.name)?', bez dopravy a DPH':''};
});

function spark(s,t){
  if(s.length<2) return '<p class="cap">Vývoj ceny sa ukáže od druhého dňa merania.</p>';
  const v=s.map(x=>x[1]).concat(t?[t]:[]),lo=Math.min(...v),hi=Math.max(...v),W=300,H=56,p=4;
  const x=i=>p+i*(W-2*p)/(s.length-1), y=n=>H-p-(n-lo)/((hi-lo)||1)*(H-2*p);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Najnižšia cena za ${s.length} dní">`
    +(t?`<line x1="0" x2="${W}" y1="${y(t)}" y2="${y(t)}"/>`:'')
    +`<path d="${s.map((q,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(q[1]).toFixed(1)).join(' ')}"/></svg>
    <p class="cap">Najnižšia ponuka za posledných ${s.length} dní, prerušovaná čiara je odhad.</p>`;
}

function lotHTML(r){
  const w=r.w, dark=/^img\/(2|17)\.jpg$/.test(w.img);
  const gap = r.gap===null ? (w.target_eur ? 'Dnes bez dostupnej ponuky' : 'Len sledujeme, limitované edície')
    : r.under ? `${eur(w.target_eur-r.best.price)} pod odhadom` : `${Math.round(r.gap*100)} % nad odhadom`;
  const offers = r.today.map(o=>`<li><a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.shop)}</a><span>${eur(o.price)}</span></li>`).join('')
    || '<li>Vypredané alebo e-shop dnes neodpovedal.</li>';
  return `<article class="lot${r.under?' under':''}">
    <div class="lotno" aria-label="Lot ${esc(w.lot)}">${esc(w.lot)}</div>${r.under?'<span class="stamp">Pod odhadom</span>':''}
    <div class="plate${dark?' bleed':''}"><img src="${esc(w.img)}" alt="${esc(w.brand+' '+w.model)}" loading="lazy"></div>
    <p class="brand">${esc(w.brand)}</p>
    <h2 class="model">${esc(w.model)}</h2>
    <p class="ref">${esc(w.ref)}</p>
    <p class="note">${esc(w.note)}</p>
    <dl class="est">
      <dt>Odhad</dt><dd>${w.target_eur?eur(w.target_eur):'—'}</dd>
      <dt>Ponuka dnes</dt><dd class="now">${r.best?eur(r.best.price):'—'}${r.best?`<small>${esc(r.best.shop)}${r.landed}</small>`:''}</dd>
      <span class="gap">${gap}</span>
    </dl>
    <details><summary>Všetky ponuky (${r.today.length})</summary><ul class="offers">${offers}</ul>${spark(r.series,w.target_eur)}</details>
  </article>`;
}

function render(v){
  let list = lots.slice();
  if(v==='lot') list.sort((a,b)=>lotKey(a.w.lot)-lotKey(b.w.lot));
  if(v==='close') list = list.filter(r=>r.gap!==null).sort((a,b)=>a.gap-b.gap);
  if(v==='under') list = list.filter(r=>r.under);
  document.getElementById('lots').innerHTML = list.length ? list.map(lotHTML).join('')
    : '<p class="empty">Žiadny lot nie je pod odhadom. Keď sa to zmení, ozve sa ti mobil.</p>';
  document.getElementById('count').textContent = `${list.length}/${lots.length}`;
}

const fmt = d => d ? new Date(d).toLocaleDateString('sk-SK',{day:'numeric',month:'long',year:'numeric'}) : '';
document.getElementById('dated').textContent = fmt(last);
document.getElementById('updated').textContent = last ? `Ceny z ${fmt(last)}, vygenerované ${DATA.generated}. Aktualizácia každý deň o 9:00.` : 'Zatiaľ bez merania.';
document.querySelectorAll('.bar button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.bar button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  render(b.dataset.v);
});
render('lot');
</script>
